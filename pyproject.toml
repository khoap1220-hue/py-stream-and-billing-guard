[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "py-stream-and-billing-guard"
version = "0.3.0"
description = "Defensive W3C SSE cross-chunk stream framing normalizer, integer-only ISO-4217 0/2/3-decimal currency & basis-point billing guard, and transactional commit-before-cleanup utilities for Python & FastAPI."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
  { name = "Khoa Phan (@khoap1220-hue)" }
]
keywords = ["fastapi", "stripe", "sse", "streaming", "fintech", "security"]

[project.scripts]
stream-billing-guard = "stream_billing_guard.__main__:main"
